    note: "PR #144"
    detail: |
      막대는 비율만, 숫자는 탭이 맡는 분담(폰 너비에 라벨이 안 들어간다).
      막대는 읽기 전용 — 8dp 는 48dp 터치 타깃을 못 채운다.
      Row 기본 정렬 때문에 막대 높이가 0 이 되던 버그를 찾아 고치고, 크기를 재는
      테스트를 붙였다 — 눈으로는 "가늘어서 안 보임"과 "높이 0"이 구분되지 않는다.
