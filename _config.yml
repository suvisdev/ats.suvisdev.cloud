title: Eval-ATS
description: >-
  AI 기반 채용 프로세스 자동화 및 지원자 통합 관리 플랫폼 — 팀 SEUK
baseurl: ""
url: "https://ats.suvisdev.cloud"
github_username: Seuk-Team

theme: just-the-docs
plugins:
  - jekyll-feed

color_scheme: dark

aux_links:
  "GitHub":
    - "https://github.com/Seuk-Team/jekyll"
  "개인 프로젝트":
    - "https://jk.suvisdev.cloud"
aux_links_new_tab: true

heading_anchors: true

nav_sort: case_insensitive

search_enabled: true
search:
  heading_level: 3

back_to_top: true
back_to_top_text: "맨 위로"

footer_content: "SEUK Team &copy; 2026 &mdash; Eval-ATS"

port: 4002

callouts:
  warning:
    title: 주의
    color: red
  note:
    title: 참고
    color: blue
  tip:
    title: 팁
    color: green

exclude:
  - CLAUDE.md
  - .jekyll-cache/
  - Gemfile
  - Gemfile.lock
